name: Weekly Link Health Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run link checker
        id: check
        run: |
          python3 check_links.py --json --timeout=15 --retry=2 > /tmp/report.json 2>/dev/null || true
          echo "broken=$(python3 -c "import json; r=json.load(open('/tmp/report.json')); print(r.get('broken', 0))")" >> "$GITHUB_OUTPUT"
          echo "bot_blocked=$(python3 -c "import json; r=json.load(open('/tmp/report.json')); print(r.get('bot_blocked', 0))")" >> "$GITHUB_OUTPUT"

      - name: Create or update issue for broken links
        if: steps.check.outputs.broken != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/report.json', 'utf8'));

            const brokenLinks = report.broken_links || [];
            const botBlockedLinks = report.bot_blocked_links || [];
            if (brokenLinks.length === 0 && botBlockedLinks.length === 0) return;

            let body = `## Broken Links Report\n\n`;
            body += `**Date:** ${new Date().toISOString().split('T')[0]}\n`;
            body += `**Total links checked:** ${report.total}\n`;
            body += `**Broken:** ${report.broken}\n`;
            body += `**Bot-blocked (false positives):** ${report.bot_blocked}\n`;
            body += `**Redirects:** ${report.redirects}\n\n`;

            if (brokenLinks.length > 0) {
              body += `### Genuinely Broken Links\n\n`;
              body += `| Line | URL | Error |\n`;
              body += `|------|-----|-------|\n`;
              for (const link of brokenLinks) {
                const text = link.text ? ` (${link.text})` : '';
                body += `| L${link.line} | ${link.url}${text} | ${link.error} |\n`;
              }
              body += `\n`;
            }

            if (botBlockedLinks.length > 0) {
              body += `<details>\n<summary>Bot-blocked links (${botBlockedLinks.length} - 403 from known WAF/bot-detection domains)</summary>\n\n`;
              body += `These domains block automated HTTP requests (Cloudflare, Akamai, TLS fingerprinting). The links are likely valid but cannot be verified programmatically.\n\n`;
              body += `| Line | URL |\n`;
              body += `|------|-----|\n`;
              for (const link of botBlockedLinks) {
                const text = link.text ? ` (${link.text})` : '';
                body += `| L${link.line} | ${link.url}${text} |\n`;
              }
              body += `\n</details>\n`;
            }

            body += `\n---\n*Generated by link-check.yml workflow*`;

            // Find existing open issue with broken-links label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-links',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log(`Updated issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Broken Links Report - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['broken-links']
              });
              console.log('Created new broken links issue');
            }

      - name: Close issue if no broken links
        if: steps.check.outputs.broken == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-links',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              const botBlocked = parseInt('${{ steps.check.outputs.bot_blocked }}') || 0;
              const comment = botBlocked > 0
                ? `All genuinely broken links are resolved. ${botBlocked} bot-blocked link(s) remain (false positives from WAF/bot-detection). Closing this issue.`
                : 'All links are now healthy. Closing this issue.';

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: comment
              });
            }
